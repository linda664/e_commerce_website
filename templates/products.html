<!DOCTYPE html>
<html>
<head>
    <title>Product List</title>
    <style>
        table {
            border-collapse: collapse;
            width: 100%;
        }
        th, td {
            padding: 8px;
            border: 1px solid #ccc;
            text-align: left;
        }
        th {
            background-color: #f0f0f0;
        }
    </style>
</head>
<body>
    <h1>🛍️ Product List</h1>
    <table>
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Category</th>
            <th>Price</th>
            <th>Stock_quantity</th>
            <th>Rating</th>
        </tr>
        {% for p in products %}
        <tr>
            <td>{{ p.product_id }}</td>
            <td>{{ p.name }}</td>
            <td>{{ p.category }}</td>
            <td>${{ p.price }}</td>
            <td>{{ p.stock_quantity }}</td>
            <td>{{ p.rating }}</td>
        </tr>
        {% endfor %}
    </table>
</body>
</html>
