<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}My E-Commerce Site{% endblock %}</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f6f6f6;
            margin: 0;
            padding: 0;
        }

        header {
            background-color: #6a1b9a;
            color: white;
            padding: 1rem 2rem;
            font-size: 1.5rem;
            display: flex;
            align-items: center;
        }

        header i {
            margin-right: 10px;
        }

        .container {
            max-width: 900px;
            margin: 2rem auto;
            background-color: white;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        a {
            color: #6a1b9a;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        h1, h2 {
            margin-top: 0;
        }

        .product-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .product-item {
            background-color: #fafafa;
            padding: 12px 16px;
            border: 1px solid #ddd;
            border-radius: 8px;
            line-height: 1.4;
        }

        .product-name {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 6px;
            word-wrap: break-word;
        }

        .product-meta {
            font-size: 14px;
        }

        .back-link {
            display: inline-block;
            margin-top: 1rem;
            font-size: 14px;
        }

        ul {
            padding-left: 1.2rem;
        }
    </style>
</head>
<body>
    <header>
        🛍 My E-Commerce Store
    </header>
    <div class="container">
        {% block content %}
        {% endblock %}
    </div>
</body>
</html>
